# cPanel - cpanel.vivzon.cloud
server {
    listen 80;
    server_name cpanel.vivzon.cloud;
    root /var/www/panel/cpanel;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/cpanel-access.log;
    error_log /var/log/nginx/cpanel-error.log;

    # Increase upload size for file manager
    client_max_body_size 512M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Security
        fastcgi_param PHP_VALUE "upload_max_filesize=512M \n post_max_size=512M";
        fastcgi_read_timeout 600;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Deny access to sensitive files
    location ~* \.(sql|log|conf|ini)$ {
        deny all;
    }
}

