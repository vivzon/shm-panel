# Webmail (Roundcube) - webmail.vivzon.cloud
server {
    listen 80;
    server_name webmail.vivzon.cloud;
    root /usr/share/roundcube;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/webmail-access.log;
    error_log /var/log/nginx/webmail-error.log;

    # Increase upload size for email attachments
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Security
        fastcgi_param PHP_VALUE "upload_max_filesize=50M \n post_max_size=50M";
        fastcgi_read_timeout 300;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Deny access to config, temp, and logs
    location ~ ^/(config|temp|logs|bin|SQL|installer)/ {
        deny all;
    }

    # Allow access to program directory for assets
    location ^~ /program/ {
        try_files $uri =404;
    }
}

